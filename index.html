<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dashboard – Akshit Kumar</title>
  <meta name="description" content="Search any city and see live weather and a five-day forecast.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Weather Dashboard</h1>
    <p class="sub">Search for a city to see the current weather and a five-day forecast.</p>

    <form id="search" novalidate>
      <label for="city" class="sr">City name</label>
      <input id="city" type="text" placeholder="Try Lucknow, Delhi or London" autocomplete="off" maxlength="60" aria-describedby="hint">
      <button id="go" type="submit">Search</button>
    </form>
    <p id="hint" class="hint" role="status" aria-live="polite"></p>

    <section id="result" aria-live="polite">
      <p class="empty">Type a city name above to get started.</p>
    </section>
  </main>

  <footer>
    <p>Weather data from Open-Meteo (free, no key needed). Built by Akshit Kumar · 2026</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
